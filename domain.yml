version: "3.1"

intents:
  - greet
  - provide_info
  - ask_course_prerequisites
  - ask_exam_schedule
  - ask_library_hours
  - goodbye
  - ask_available_courses
  - ask_registration_process
  - ask_professor_contact
  - ask_department_office
  - ask_academic_calendar
  - ask_tuition_payment
  - ask_scholarships


entities:
  - student_name
  - student_id
  - student_major
  - student_email

slots:
  student_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: student_info_form
            requested_slot: student_name

  student_id:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: student_info_form
            requested_slot: student_id

  student_major:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: student_info_form
            requested_slot: student_major

  student_email:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: student_info_form
            requested_slot: student_email

responses:
  utter_greet:
    - text: "Hello! I’m DePaul Student Support Bot. Let’s start with some info."

  utter_ask_student_name:
    - text: "What’s your full name?"

  utter_ask_student_id:
    - text: "Can you please provide your student ID?"

  utter_ask_student_major:
    - text: "What’s your major?"

  utter_ask_student_email:
    - text: "Please share your DePaul student email."

  utter_thank_you:
    - text: "Thanks {student_name}! I’ve saved your info: ID {student_id}, Major {student_major}, Email {student_email}. What would you like to know now?"

  utter_course_prerequisites:
    - text: "You typically need basic Python and math for AI and DS courses."

  utter_exam_schedule:
    - text: "Final exams usually take place in the last 2 weeks of the quarter."

  utter_library_hours:
    - text: "The DePaul library is open from 8 AM to 10 PM on weekdays."

  utter_goodbye:
    - text: "Goodbye! Let me know if you need anything else."
  
  utter_available_courses:
    - text: "You can view available courses for the current quarter on Campus Connect or DePaul's course catalog. Popular CS courses include CSC 403, CSC 455, and CSC 478."

  utter_registration_process:
    - text: "To register, log into Campus Connect, navigate to the Student Center, and choose 'Enroll in a Class'."

  utter_professor_contact:
    - text: "You can find professor contact information on the DePaul faculty directory or through your course portal."

  utter_department_office:
    - text: "The CS Department is located in CDM Center, Room 210. You can call 312-362-8381 for help."

  utter_academic_calendar:
    - text: "You can view the full academic calendar at: https://www.depaul.edu/academic-calendar"

  utter_tuition_payment:
    - text: "Tuition can be paid through Campus Connect under the 'Student Account' section. You can pay online via credit card or bank transfer."

  utter_scholarships:
    - text: "DePaul offers merit-based and need-based scholarships. Visit https://www.depaul.edu/scholarships for more info."


forms:
  student_info_form:
    required_slots:
      - student_name
      - student_id
      - student_major
      - student_email

actions:
  - utter_greet
  - utter_ask_student_name
  - utter_ask_student_id
  - utter_ask_student_major
  - utter_ask_student_email
  - utter_thank_you
  - utter_course_prerequisites
  - utter_exam_schedule
  - utter_library_hours
  - utter_available_courses
  - utter_registration_process
  - utter_professor_contact
  - utter_department_office
  - utter_academic_calendar
  - utter_tuition_payment
  - utter_scholarships
  - utter_goodbye
